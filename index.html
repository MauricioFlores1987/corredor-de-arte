<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Corredor de Arte</title>
<style>html,body{margin:0;height:100%;background:#1d1b3a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}#g{width:100%;height:100%}</style>
</head><body><div id="g"></div>
<script src="phaser.min.js"></script>
<script>window.Phaser||document.write('<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"><\/script>')</script>
<script>
const W=960,H=540,GROUND=500,F="'Trebuchet MS','Comic Sans MS',sans-serif";
const G={char:'girl',name:'',level:0,lives:3,score:0,phr:0,canv:0,muted:false};
const newG=c=>Object.assign(G,{char:c,level:0,lives:3,score:0,phr:0,canv:0});
const LV=[
{n:'Entrada y Pasillo Principal',w:0xcfe8f7,f:0xb98a5a,e:'🚪',t:'intro'},
{n:'Pasillo de Casilleros',w:0xfff0b3,f:0xc9a46a,e:'🔐',t:'lockers'},
{n:'Patio y Áreas Verdes',w:0x9fdcff,f:0x62b84a,e:'🌳',t:'yard'},
{n:'Ciencias y Biología',w:0xcdeed0,f:0xd8d8d0,e:'🧪',t:'science'},
{n:'Matemáticas y Geometría',w:0xe9dcff,f:0xc9b48a,e:'📐',t:'math'},
{n:'Música y Sonido',w:0xffd3e6,f:0xa87c5a,e:'🎵',t:'music'},
{n:'Gimnasio',w:0xffc9a3,f:0xd9a05b,e:'🏀',t:'gym'},
{n:'Biblioteca',w:0xe3cba8,f:0x8a5a3a,e:'📚',t:'library'},
{n:'Galería de Arte',w:0xf3f3f3,f:0x777777,e:'🖼️',t:'gallery'},
{n:'Taller Principal de Arte',w:0xffe08a,f:0x9a6b3f,e:'🎨',t:'boss'}];
const PHR=['¡Dibujo perfecto!','¡Buenas proporciones!','¡Qué buen trazo!','¡Color vibrante!','¡Obra maestra!'];
const PAL=[0x2ea8ff,0xff4d6d,0xffd23f,0x6bd968,0xb15cff];
const txt=(s,x,y,t,sz,col,extra)=>s.add.text(x,y,t,Object.assign({fontFamily:F,fontSize:sz+'px',color:col||'#fff',fontStyle:'bold',stroke:'#000',strokeThickness:Math.round(sz/7)},extra||{})).setOrigin(.5);

/* ---------- AUDIO (WebAudio, sin archivos) ---------- */
const A={c:null,iv:null,
init(){if(!this.c){try{this.c=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.c&&this.c.state==='suspended')this.c.resume()},
tone(f,d,ty,v,sl){if(!this.c||G.muted)return;const c=this.c,t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sl),t+d);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.03)},
sfx(k){const m={jump:[300,.15,'square',.04,300],hit:[260,.15,'sawtooth',.05,-150],coin:[880,.14,'triangle',.07,500],hurt:[200,.35,'sawtooth',.07,-130],full:[400,.6,'square',.05,900],door:[500,.3,'triangle',.06,400],spring:[250,.3,'sine',.1,700],ok:[660,.25,'triangle',.07,500]}[k];if(m)this.tone(...m)},
music(m){this.stop();if(!this.c)return;let st=0;const N=[523,587,659,784,880],M=[0,2,4,2,3,2,1,0,0,2,4,3,2,1,2,-1],B=[131,196,175,196],r=2**((m==='play'?[0,2,4,5,7,9,7,5,4,0][G.level]:0)/12);
this.iv=setInterval(()=>{const i=M[st%16];if(m==='play'){if(i>=0)this.tone(N[i]*r,.16,'square',.02);if(st%4===0)this.tone(B[(st>>2)%4]*r,.4,'triangle',.06)}else if(i>=0)this.tone(N[i]*r*.5,.5,'sine',.05);st++},m==='play'?200:420)},
stop(){clearInterval(this.iv)}};

/* ---------- FORMAS DEL MINIJUEGO DE LIENZO ---------- */
const circ=(cx,cy,r,n)=>Array.from({length:(n||16)+1},(_,i)=>[cx+r*Math.cos(i/(n||16)*6.2832),cy+r*Math.sin(i/(n||16)*6.2832)]);
const SHAPES=[
{n:'Estrella',p:[Array.from({length:11},(_,i)=>{const r=i%2?.2:.46,a=-1.5708+i*.6283;return[.5+r*Math.cos(a),.52+r*Math.sin(a)]})]},
{n:'Compás',p:[[[.5,.2],[.25,.9]],[[.5,.2],[.75,.9]],circ(.5,.14,.07,10)]},
{n:'Nota musical',p:[circ(.35,.78,.14),[[.49,.78],[.49,.2],[.78,.38]]]},
{n:'Triángulo',p:[[[.5,.12],[.9,.85],[.1,.85],[.5,.12]]]},
{n:'Corazón',p:[Array.from({length:33},(_,i)=>{const t=i/32*6.2832;return[.5+.48*Math.pow(Math.sin(t),3),.45-.03*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))]})]},
{n:'Casa',p:[[[.15,.85],[.85,.85],[.85,.45],[.5,.12],[.15,.45],[.15,.85]]]}];

/* ---------- BOOT: genera todos los dibujos ---------- */
class Boot extends Phaser.Scene{constructor(){super('Boot')}
create(){const s=this,g=s.add.graphics();
const tx=(k,w,h,fn)=>{g.clear();fn(g);g.generateTexture(k,w,h)};
tx('px',8,8,g=>g.fillStyle(0xffffff).fillRect(0,0,8,8));
const person=(k,girl)=>tx(k,36,52,g=>{
g.fillStyle(0x3b6fd1).fillRect(9,34,7,14).fillRect(20,34,7,14);g.fillStyle(0x7a4a2a).fillRect(8,47,9,5).fillRect(19,47,9,5);
g.fillStyle(girl?0xf2f2f2:0xf5c542).fillRect(7,20,22,16);g.fillStyle(girl?0x62c46a:0x2f5fc4).fillRect(10,24,16,14);
if(!girl)g.fillRect(10,20,4,6).fillRect(22,20,4,6);
g.fillStyle(0xff4d6d).fillCircle(14,30,2);g.fillStyle(0xffd23f).fillCircle(21,33,2);
g.fillStyle(0xf1c27d).fillCircle(18,12,10);
if(girl)g.fillStyle(0x6b3e26).fillRect(5,8,6,20);
g.fillStyle(girl?0xd62828:0x8a1c1c).fillEllipse(19,5,28,11).fillCircle(25,0,2);
g.fillStyle(0).fillCircle(21,13,1.6).fillCircle(15,13,1.6);g.lineStyle(1.5,0x7a2a2a).beginPath().arc(18,15,4,.2,2.9).strokePath()});
person('boy',false);person('girl',true);
tx('brush',66,14,g=>{g.fillStyle(0x8b5a2b).fillRect(0,5,36,4);g.fillStyle(0xbbbbbb).fillRect(36,3,9,8);g.fillStyle(0x1e90ff).fillEllipse(55,7,24,12)});
const stick=(k,h,leg)=>tx(k,32,h,g=>{const te=h-2-leg;g.fillStyle(0xffffff).fillCircle(16,12,10);g.lineStyle(3,0x111111).strokeCircle(16,12,10);
g.lineBetween(16,22,16,te);g.lineBetween(16,26,3,34);g.lineBetween(16,26,29,20);g.lineBetween(16,te,7,h-2);g.lineBetween(16,te,26,h-4);
g.lineBetween(11,9,15,13);g.lineBetween(15,9,11,13);g.strokeCircle(21,11,2);g.lineBetween(11,17,14,15);g.lineBetween(14,15,18,18);g.lineBetween(18,18,22,15)});
stick('stick',48,12);stick('stickL',68,34);
tx('note',22,24,g=>{g.fillStyle(0x222222).fillCircle(8,19,5).fillRect(11,2,2,17).fillRect(11,2,8,4)});
tx('page',26,32,g=>{g.fillStyle(0xfffaf0).fillRect(0,0,26,32).lineStyle(1,0x999999).strokeRect(0,0,26,32);for(let y=7;y<28;y+=5)g.lineBetween(4,y,22,y)});
tx('tramp',72,22,g=>{g.fillStyle(0x333333).fillRect(6,10,4,12).fillRect(62,10,4,12);g.fillStyle(0xe63946).fillRoundedRect(0,2,72,9,4)});
tx('easel',56,92,g=>{g.lineStyle(4,0x6b4423).lineBetween(8,90,20,50).lineBetween(48,90,36,50).lineBetween(28,50,28,90);g.fillStyle(0xffffff).fillRect(4,4,48,54).lineStyle(3,0x6b4423).strokeRect(4,4,48,54)});
tx('door',72,112,g=>{g.fillStyle(0x7a4a22).fillRect(0,0,72,112);g.fillStyle(0x93602f).fillRect(6,6,60,100);g.fillStyle(0xffd23f).fillCircle(58,60,4)});
g.destroy();s.scene.start('Menu')}}

/* ---------- MENÚ ---------- */
class Menu extends Phaser.Scene{constructor(){super('Menu')}
create(){const s=this;A.stop();s.add.rectangle(0,0,W,H,0xcfe8f7).setOrigin(0);s.add.rectangle(0,GROUND,W,40,0xb98a5a).setOrigin(0);
const t=txt(s,W/2,80,'🎨 CORREDOR DE ARTE',54,'#ffd23f');s.tweens.add({targets:t,scale:1.06,duration:900,yoyo:true,repeat:-1});
txt(s,W/2,150,'Elige tu artista',26,'#fff');
[['boy','Chico',250],['girl','Chica',710]].forEach(([k,n,x])=>{
const r=s.add.rectangle(x,320,230,250,0xffffff,.9).setStrokeStyle(5,0x2e4a9c).setInteractive({useHandCursor:true});
s.add.image(x,300,k).setScale(3.4);txt(s,x,425,n,28,'#2e4a9c',{stroke:'#fff'});
r.on('pointerover',()=>r.setFillStyle(0xfff3b0));r.on('pointerout',()=>r.setFillStyle(0xffffff,.9));
r.on('pointerdown',()=>{A.init();A.sfx('ok');newG(k);let nm='';try{nm=(prompt('¿Cómo te llamas? (para firmar tu obra)','')||'').trim().slice(0,14)}catch(e){}G.name=nm||n;s.scene.start('Play')})});
txt(s,W/2,H-16,'Flechas/WASD mover · Espacio saltar · X pincel · En celular usa los botones',15,'#fff')}}

/* ---------- JUEGO ---------- */
class Play extends Phaser.Scene{constructor(){super('Play')}
create(){const s=this,L=LV[G.level],t=L.t,boss=t==='boss',WW=boss?1800:3400;
Object.assign(s,{L,t,WW,face:1,inv:0,full:0,cd:0,swU:0,mini:false,leaving:false,bossDead:false,jp:false,ap:false,items:[],easels:[],tr:[],pd:[],T:{l:0,r:0,j:0,a:0}});
s.physics.world.setBounds(0,0,WW,H);s.cameras.main.setBounds(0,0,WW,H);
s.add.rectangle(0,0,W,H,L.w).setOrigin(0).setScrollFactor(0);
s.add.rectangle(0,300,WW,200,Phaser.Display.Color.ValueToColor(L.w).darken(10).color).setOrigin(0);
for(let x=150;x<WW;x+=300){s.add.rectangle(x,150,86,64,0xbfe6ff).setStrokeStyle(5,0xffffff).setScrollFactor(.85);s.add.text(x+150,330,L.e,{fontSize:'80px'}).setOrigin(.5).setAlpha(.55).setScrollFactor(.85)}
txt(s,200,170,L.n.toUpperCase(),20,'#222',{backgroundColor:'#fff',padding:{x:10,y:6},stroke:'#fff',strokeThickness:0});
s.add.image(60,GROUND,'door').setOrigin(.5,1);
/* suelo y plataformas */
const pl=s.pl=s.physics.add.staticGroup();
const box=(x,y,w,h,c)=>pl.create(x+w/2,y+h/2,'px').setDisplaySize(w,h).setTint(c).refreshBody();
box(0,GROUND,WW,H-GROUND,L.f);s.add.rectangle(0,GROUND,WW,6,0x000000,.25).setOrigin(0);
const pls=[];if(boss){pls.push([500,400,150],[1200,400,150])}else for(let i=0;i<9;i++){const x=430+i*340;if(x>WW-420)break;pls.push([x,[430,360,290,360][i%4]-(t==='gym'?20:0),t==='math'?190:130])}
const LK=[0x3d7be0,0xe05a4f,0x4caf50,0xf2b632];
pls.forEach(([x,y,w],i)=>{if(t==='lockers'){box(x,y,w,70,LK[i%4]);s.add.text(x+w/2,y+36,'▯ ▯',{fontSize:'24px',color:'#fff'}).setOrigin(.5)}else if(t==='math')box(x,y,w,12,0xd9a441);else box(x,y,w,14,0x8b5a2b);
if(t==='science')s.add.text(x+w/2,y-14,'🧪',{fontSize:'26px'}).setOrigin(.5)});
/* rasgos por etapa */
if(t==='gym')for(let i=0;i<6;i++){const x=600+i*480;if(x<WW-300){s.tr.push(s.add.image(x,GROUND,'tramp').setOrigin(.5,1))}}
if(t==='science')for(let i=0;i<5;i++){const x=750+i*520,w=160;if(x<WW-300){s.add.rectangle(x,GROUND-4,w,8,PAL[3],.85);s.pd.push([x,w])}}
/* frases */
const nP=boss?0:t==='gallery'?7:3;
for(let k=0;k<nP;k++){let x,y;if(t==='gym'&&s.tr[k]){x=s.tr[k].x;y=200}else{const q=pls[(k*2+1)%pls.length];x=q[0]+q[2]/2;y=q[1]-50}
const o=s.add.text(x,y,'💬',{fontSize:'36px'}).setOrigin(.5);s.tweens.add({targets:o,y:y-10,duration:700,yoyo:true,repeat:-1});s.items.push(o)}
/* caballetes */
(boss?[600]:[1000,2100,2900]).slice(0,boss?1:G.level<4?2:3).forEach(x=>{const e=s.add.image(x,GROUND,'easel').setOrigin(.5,1);e.used=false;s.easels.push(e);s.tweens.add({targets:e,alpha:.75,duration:600,yoyo:true,repeat:-1})});
/* puerta de salida / lienzo final */
if(boss){s.add.image(1650,GROUND,'easel').setOrigin(.5,1).setScale(1.6);s.add.ellipse(1650,GROUND-80,200,220,0xfff6c2,.35)}
else{s.exit=s.add.image(WW-100,GROUND,'door').setOrigin(.5,1);const nx=LV[G.level+1];txt(s,WW-100,GROUND-135,'▶ '+nx.n,16,'#fff')}
/* jugador */
const p=s.p=s.physics.add.sprite(120,GROUND-60,G.char).setDepth(4);p.body.setSize(22,48).setOffset(7,4);p.setCollideWorldBounds(true);
s.br=s.add.image(0,0,'brush').setOrigin(.08,.5).setDepth(5);s.aura=s.add.circle(0,0,48,0xffffff,.28).setDepth(3).setVisible(false);
/* enemigos y proyectiles */
s.en=s.physics.add.group();s.pr=s.physics.add.group({allowGravity:false});
if(boss){s.mk(1400,'boss')}else{const n=Math.min(10,6+G.level);for(let k=0;k<n;k++){const ty=t==='yard'?'jumper':t==='music'?(k%2?'singer':'basic'):(t==='gallery'||t==='gym')?['basic','jumper','singer'][k%3]:G.level>5&&k%4===3?'jumper':'basic';s.mk(700+k*((WW-1100)/n),ty)}}
if(t==='library')s.time.addEvent({delay:1700,loop:true,callback:()=>s.shoot('page',s.cameras.main.scrollX+W+30,200+Math.random()*250,-170)});
s.physics.add.collider(p,pl);s.physics.add.collider(s.en,pl);
s.physics.add.overlap(p,s.en,(a,e)=>s.touch(e));s.physics.add.overlap(p,s.pr,(a,o)=>{o.destroy();s.hurt()});
s.cameras.main.startFollow(p,true,.1,.1);s.cameras.main.fadeIn(400);
/* controles */
s.k=s.input.keyboard.addKeys('LEFT,RIGHT,UP,SPACE,A,D,W,X,Z,J');s.input.addPointer(2);
if(s.sys.game.device.input.touch){const btn=(x,y,lab,key)=>{const c=s.add.circle(x,y,44,0xffffff,.28).setStrokeStyle(3,0xffffff,.7).setScrollFactor(0).setDepth(60).setInteractive();s.add.text(x,y,lab,{fontSize:'30px'}).setOrigin(.5).setScrollFactor(0).setDepth(61);c.on('pointerdown',()=>s.T[key]=1);['pointerup','pointerout'].forEach(e=>c.on(e,()=>s.T[key]=0))};
btn(70,455,'◀','l');btn(175,455,'▶','r');btn(790,470,'🖌️','a');btn(890,410,'⬆','j')}
/* HUD */
const hu=o=>o.setScrollFactor(0).setDepth(50);
hu(s.add.rectangle(0,0,W,46,0x1b2a55,.88).setOrigin(0));
s.hl=[0,1,2,3,4].map(i=>hu(s.add.image(34+i*46,24,'brush').setScale(.6).setAngle(-30).setTint(PAL[i])));
s.hs=hu(txt(s,W-200,23,'',20,'#ffd23f'));s.hp=hu(txt(s,W-70,23,'',18,'#fff'));
s.hf=hu(txt(s,W/2,506,'',17,'#fff'));hu(s.add.rectangle(W/2-150,524,300,12,0x000000,.6).setOrigin(0,.5));s.hb=hu(s.add.rectangle(W/2-150,524,0,12,0xffd23f).setOrigin(0,.5));
const mu=hu(s.add.text(W-26,23,'🔊',{fontSize:'24px'}).setOrigin(.5).setInteractive({useHandCursor:true}));mu.on('pointerdown',()=>{G.muted=!G.muted;mu.setText(G.muted?'🔇':'🔊')});
const bn=hu(txt(s,W/2,200,'Etapa '+(G.level+1)+': '+L.n,32,'#ffd23f'));s.tweens.add({targets:bn,alpha:0,delay:2200,duration:600});
A.music('play');
if(G.level===0){const h=hu(txt(s,W/2,262,(s.sys.game.device.input.touch?'¡Llega a la puerta del final del pasillo! Usa ⬆ para saltar y 🖌️ para pintar':'¡Llega a la puerta del final del pasillo! Salta con ESPACIO y pinta con X'),18,'#fff'));s.tweens.add({targets:h,alpha:0,delay:5000,duration:600})}}
mk(x,ty){const s=this,e=s.en.create(x,100,ty==='jumper'?'stickL':'stick');Object.assign(e,{ty,hp:ty==='boss'?12:1,home:x,dir:Math.random()<.5?-1:1,sp:ty==='jumper'?90:ty==='boss'?75:60,t:Math.random()*1200});e.setCollideWorldBounds(true);
if(ty==='jumper')e.setTint(0xcfe3ff);if(ty==='singer')e.setTint(0xf0c8ff);if(ty==='boss'){e.setScale(3).setTint(0xffaaaa)}return e}
shoot(k,x,y,vx){const o=this.pr.create(x,y,k);o.setVelocityX(vx);o.body.allowGravity=false;o.by=y;o.born=this.time.now;o.k=k}
splat(x,y,n,col){for(let i=0;i<n;i++){const c=this.add.circle(x,y,4+Math.random()*8,col||PAL[i%5]).setDepth(6);this.tweens.add({targets:c,x:x+(Math.random()-.5)*130,y:y+(Math.random()-.5)*90,alpha:0,duration:550,onComplete:()=>c.destroy()})}}
say(x,y,t,c){const o=txt(this,x,y,t,22,c||'#ffd23f').setDepth(9);this.tweens.add({targets:o,y:y-60,alpha:0,duration:1400,onComplete:()=>o.destroy()})}
damage(e,n){if(e.dying)return;e.hp-=n;if(e.hp>0){e.setAlpha(.4);this.time.delayedCall(90,()=>e.active&&e.setAlpha(1));A.sfx('hit');return}
e.dying=true;e.body.enable=false;G.score+=e.ty==='boss'?1000:100;A.sfx('hit');this.splat(e.x,e.y,e.ty==='boss'?28:12);this.say(e.x,e.y-40,'¡DIBUJO BORRADO!');
this.tweens.add({targets:e,alpha:0,scaleX:0,duration:380,onComplete:()=>e.destroy()});
if(e.ty==='boss'){this.bossDead=true;this.cameras.main.shake(500,.01);this.time.delayedCall(1800,()=>{this.cameras.main.fadeOut(700);this.cameras.main.once('camerafadeoutcomplete',()=>this.scene.start('End'))})}}
touch(e){if(e.dying||this.leaving)return;const p=this.p;if(this.full>0){this.damage(e,99);return}
if(p.body.velocity.y>120&&p.y<e.y-e.displayHeight*.15){this.damage(e,1);p.setVelocityY(-430)}else this.hurt()}
hurt(){const s=this;if(s.time.now<s.inv||s.full>0||s.p.dead||s.leaving)return;G.lives--;A.sfx('hurt');s.cameras.main.shake(200,.012);
if(G.lives<=0){s.p.dead=true;s.physics.pause();A.stop();s.time.delayedCall(700,()=>s.scene.start('Over'));return}
s.inv=s.time.now+1500;s.p.setVelocity(-s.face*260,-320)}
swing(){const s=this,f=s.face,full=s.full>0,reach=full?180:95;s.cd=s.time.now+(full?220:380);s.swU=s.time.now+300;A.sfx('hit');
s.tweens.add({targets:s.br,angle:{from:f*-70,to:f*45},duration:140,yoyo:true});
s.splat(s.p.x+f*reach*.7,s.p.y,full?10:5,PAL[Math.floor(Math.random()*5)]);
const R=new Phaser.Geom.Rectangle(f>0?s.p.x:s.p.x-reach,s.p.y-45,reach,90);
s.en.getChildren().forEach(e=>{if(e.active&&!e.dying&&Phaser.Geom.Rectangle.Overlaps(R,e.getBounds()))s.damage(e,full?3:1)});
s.pr.getChildren().forEach(o=>{if(o.active&&Phaser.Geom.Rectangle.Overlaps(R,o.getBounds())){s.splat(o.x,o.y,4);G.score+=10;o.destroy()}})}
collect(o){const s=this;o.destroy();A.sfx('coin');G.score+=50;G.phr++;s.say(o.x,o.y-30,PHR[Math.floor(Math.random()*5)].toUpperCase());
if(G.phr>=5){G.phr=0;s.full=8000;A.sfx('full');s.cameras.main.flash(300,255,215,0);s.say(s.p.x,s.p.y-80,'¡MODO FULL ARTE!','#ff8ad8')}}
next(){const s=this;if(s.leaving)return;s.leaving=true;A.sfx('door');s.cameras.main.fadeOut(500);s.cameras.main.once('camerafadeoutcomplete',()=>{G.level++;s.scene.restart()})}
openCanvas(e){const s=this;e.used=true;e.setTint(0x888888).setAlpha(1);s.tweens.killTweensOf(e);s.mini=true;s.physics.pause();

update(time,dt){const s=this,p=s.p,k=s.k,T=s.T;

s.br.setPosition(p.x+s.face*8,p.y+6).setScale(s.face*(s.full>0?2:1),s.full>0?2:1);if(time>s.swU)s.br.angle=s.face*-25;
if(s.full>0){s.full-=dt;p.setTint(Phaser.Display.Color.HSVToRGB((time/500)%1,.6,1).color);s.aura.setVisible(true).setPosition(p.x,p.y).setFillStyle(Phaser.Display.Color.HSVToRGB((time/400)%1,.7,1).color,.3);if(s.full<=0){s.full=0;p.clearTint();s.aura.setVisible(false)}}
s.tr.forEach(r=>{if(p.body.velocity.y>0&&Math.abs(p.x-r.x)<40&&p.body.bottom>=r.y-24&&p.body.bottom<=r.y+8){p.setVelocityY(-850);A.sfx('spring');s.tweens.add({targets:r,scaleY:.5,duration:90,yoyo:true})}});
s.items.forEach(o=>{if(o.active&&Math.abs(p.x-o.x)<36&&Math.abs(p.y-o.y)<50)s.collect(o)});

s.en.getChildren().forEach(e=>{if(!e.active||e.dying)return;e.t+=dt;const g=e.body.blocked.down||e.body.touching.down;
if(e.ty==='boss'){e.setVelocityX(Math.sign(p.x-e.x)*e.sp);if(g&&e.t>1800){e.t=0;e.setVelocityY(-560)}}
else{if(Math.abs(e.x-e.home)>140)e.dir=Math.sign(e.home-e.x);if(e.body.blocked.left)e.dir=1;if(e.body.blocked.right)e.dir=-1;e.setVelocityX(e.dir*e.sp);
if(e.ty==='jumper'&&g&&e.t>1500){e.t=0;e.setVelocityY(-760)}
if(e.ty==='singer'&&e.t>2300&&Math.abs(e.x-p.x)<520&&Math.abs(e.y-p.y)<200){e.t=0;s.shoot('note',e.x,e.y-20,Math.sign(p.x-e.x)*200)}}
e.setFlipX(e.body.velocity.x<0)});
s.pr.getChildren().forEach(o=>{if(!o.active)return;if(o.k==='page')o.y=o.by+Math.sin((time-o.born)/300)*45;if(time-o.born>7000)o.destroy()});
if(s.exit&&Math.abs(p.x-s.exit.x)<45&&onG)s.next()}}
